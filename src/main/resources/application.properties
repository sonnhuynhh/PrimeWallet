# ==================== CRYPTO → FIAT BRIDGE ====================
# User gửi crypto tới treasury; backend xác minh tx rồi topUp VND.
# Đặt địa chỉ treasury thật qua biến môi trường hoặc application-local.properties.
bridge.enabled=true
bridge.quote-ttl-seconds=300
bridge.rate-cache-seconds=60
bridge.spread-bps=0
bridge.coingecko-api-key=${COINGECKO_API_KEY:}
bridge.treasury.eth_sepolia=${BRIDGE_TREASURY_ETH_SEPOLIA:0x0000000000000000000000000000000000000001}
bridge.treasury.eth_mainnet=${BRIDGE_TREASURY_ETH_MAINNET:}
bridge.treasury.bsc_mainnet=${BRIDGE_TREASURY_BSC_MAINNET:}
bridge.treasury.polygon_mainnet=${BRIDGE_TREASURY_POLYGON_MAINNET:}
bridge.treasury.base_mainnet=${BRIDGE_TREASURY_BASE_MAINNET:}
# Fallback khi CoinGecko lỗi (VND / 1 token)
bridge.rates.eth_sepolia.ETH=65000000
bridge.rates.eth_sepolia.USDC=25000
bridge.rates.eth_sepolia.USDT=25000
bridge.rates.eth_sepolia.DAI=25000
bridge.rates.eth_mainnet.ETH=65000000
bridge.rates.eth_mainnet.USDC=25000
bridge.rates.eth_mainnet.USDT=25000
bridge.rates.bsc_mainnet.BNB=15000000
bridge.rates.bsc_mainnet.USDT=25000
bridge.rates.polygon_mainnet.POL=5000
bridge.rates.polygon_mainnet.USDC=25000
bridge.rates.base_mainnet.ETH=65000000
bridge.rates.base_mainnet.USDC=25000

# ==================== CORS ====================
# Danh sách origin được phép gọi API (phân cách bằng dấu phẩy).
# Dev: Vite web (5173), Expo web (19006), Metro bundler (8081). Prod: đặt domain thật qua biến môi trường.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:19006,http://localhost:8081}

# ==================== ACTUATOR (Health check / Monitoring) ====================
# Chỉ expose health + info (không lộ env, beans, ... ra ngoài vì lý do bảo mật).
# /actuator/health dùng cho Docker health check và load balancer.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ==================== SERVER ====================
server.port=8080

# ==================== AI MICROSERVICE ====================
# AI service (FastAPI) nhận dữ liệu giao dịch qua Kafka, API này chỉ để UI đọc kết quả
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}