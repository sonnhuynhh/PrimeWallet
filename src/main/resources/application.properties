spring.application.name=PrimeWallet

# ==================== DATABASE ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/primewallet_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ==================== HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==================== JWT ====================
jwt.secret=UHJpbWVXYWxsZXRTdXBlclNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjIwMjRNdXN0QmVBdExlYXN0MjU2Qml0cw==
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ==================== REDIS ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==================== KAFKA ====================
# Kafka broker chạy trên Docker (docker-compose.yml)
spring.kafka.bootstrap-servers=localhost:9092

# --- Producer Config ---
# Producer là bên GỬI event (TransactionService gửi event sau giao dịch)
#
# key-serializer: Mã hóa key của message (dùng String = transaction ID)
# value-serializer: Mã hóa body của message (dùng JSON để gửi object Java)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Consumer Config ---
# Consumer là bên NHẬN event (NotificationConsumer lắng nghe và xử lý)
#
# group-id: Tên nhóm consumer. Kafka đảm bảo mỗi message chỉ được
#           xử lý bởi 1 consumer trong cùng group (tránh xử lý trùng).
# auto-offset-reset: "earliest" = đọc từ đầu nếu consumer mới tham gia
#                     (không bỏ sót event nào)
spring.kafka.consumer.group-id=primewallet-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Cho phép deserialize class TransactionEvent từ JSON.
# Nếu không có dòng này → Kafka từ chối nhận message vì lý do bảo mật
# (tránh deserialize class nguy hiểm từ nguồn không tin cậy).
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sonnhuynhh.primewallet.*

# ==================== SERVER ====================
server.port=8080