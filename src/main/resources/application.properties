spring.application.name=PrimeWallet
spring.profiles.active=local

# ==================== DATABASE ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/primewallet_db
spring.datasource.username=postgres
# Fix #19: KHÔNG commit mật khẩu thật. Giá trị đọc từ:
#   - biến môi trường DB_PASSWORD, HOẶC
#   - application-local.properties (đã .gitignore)
# Không có giá trị mặc định → app fail-fast nếu thiếu (tránh chạy nhầm với mật khẩu rác).
spring.datasource.password=${DB_PASSWORD}

# ==================== HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==================== JWT ====================
# Fix #19: Bí mật ký JWT đọc từ biến môi trường JWT_SECRET hoặc application-local.properties.
# Không có mặc định → fail-fast nếu thiếu.
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ==================== REDIS ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Fix #29: Mật khẩu Redis (tuỳ chọn). Để trống = không auth (tiện cho local dev).
# Prod: đặt REDIS_PASSWORD và bật requirepass trong docker-compose.yml.
spring.data.redis.password=${REDIS_PASSWORD:}

# ==================== KAFKA ====================
# Kafka broker chạy trên Docker (docker-compose.yml)
spring.kafka.bootstrap-servers=localhost:9092

# --- Producer Config ---
# Producer là bên GỬI event (TransactionService gửi event sau giao dịch)
#
# key-serializer: Mã hóa key của message (dùng String = transaction ID)
# value-serializer: Mã hóa body của message (dùng JSON để gửi object Java)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Consumer Config ---
# Consumer là bên NHẬN event (NotificationConsumer lắng nghe và xử lý)
#
# group-id: Tên nhóm consumer. Kafka đảm bảo mỗi message chỉ được
#           xử lý bởi 1 consumer trong cùng group (tránh xử lý trùng).
# auto-offset-reset: "earliest" = đọc từ đầu nếu consumer mới tham gia
#                     (không bỏ sót event nào)
spring.kafka.consumer.group-id=primewallet-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Cho phép deserialize class TransactionEvent từ JSON.
# Nếu không có dòng này → Kafka từ chối nhận message vì lý do bảo mật
# (tránh deserialize class nguy hiểm từ nguồn không tin cậy).
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sonnhuynhh.primewallet.*

# ==================== RATE LIMITING ====================
# Giới hạn số request/phút (chống DDoS, brute-force)
# API thường: 60 req/phút (1 req/giây)
# API login: 5 req/phút (chống brute-force password)
rate-limit.requests-per-minute=60
rate-limit.login-requests-per-minute=5

# ==================== VNPAY PAYMENT GATEWAY ====================
vnpay.tmn-code=${VNPAY_TMN_CODE:YOUR_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET:YOUR_HASH_SECRET}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# Redirect sau thanh toán — frontend gọi /api/payment/vnpay/confirm để cộng tiền (local dev).
# Production: đặt URL public + cấu hình IPN URL trong Merchant Admin VNPAY.
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/vnpay-return}

# ==================== ETHERSCAN / EXPLORER API ====================
# API key miễn phí tại https://etherscan.io/apis — dùng chung cho Sepolia/Polygon/Base.
# BSC testnet cần key riêng tại https://bscscan.com/apis (cùng định dạng).
etherscan.api-key=${ETHERSCAN_API_KEY:}

