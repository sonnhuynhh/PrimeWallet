blockchain.networks.polygon_amoy.explorer-url=https://amoy.polygonscan.com
blockchain.networks.polygon_amoy.etherscan-api-url=https://api-amoy.polygonscan.com/api
blockchain.networks.polygon_amoy.testnet=true

