blockchain.networks.bsc_mainnet.symbol=BNB
blockchain.networks.bsc_mainnet.label=BNB Smart Chain
blockchain.networks.bsc_mainnet.explorer-url=https://bscscan.com
blockchain.networks.bsc_mainnet.etherscan-api-url=https://api.bscscan.com/api
blockchain.networks.bsc_mainnet.testnet=false

blockchain.networks.polygon_mainnet.rpc-url=${POLYGON_MAINNET_RPC:https://polygon-rpc.com}
blockchain.networks.polygon_mainnet.chain-id=137
blockchain.networks.polygon_mainnet.symbol=POL
blockchain.networks.polygon_mainnet.label=Polygon
blockchain.networks.polygon_mainnet.explorer-url=https://polygonscan.com
blockchain.networks.polygon_mainnet.etherscan-api-url=https://api.polygonscan.com/api
blockchain.networks.polygon_mainnet.testnet=false

blockchain.networks.base_mainnet.rpc-url=${BASE_MAINNET_RPC:https://mainnet.base.org}
blockchain.networks.base_mainnet.chain-id=8453
blockchain.networks.base_mainnet.symbol=ETH
blockchain.networks.base_mainnet.label=Base
blockchain.networks.base_mainnet.explorer-url=https://basescan.org
blockchain.networks.base_mainnet.etherscan-api-url=https://api.basescan.org/api
blockchain.networks.base_mainnet.testnet=false

# Danh sách token ERC-20 mặc định hiển thị trên mỗi mạng (contract address)
