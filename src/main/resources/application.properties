# ==================== CORS ====================
# Danh sách origin được phép gọi API (phân cách bằng dấu phẩy).
# Dev: Vite web (5173), Expo web (19006), Metro bundler (8081). Prod: đặt domain thật qua biến môi trường.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:19006,http://localhost:8081}

# ==================== ACTUATOR (Health check / Monitoring) ====================
# Chỉ expose health + info (không lộ env, beans, ... ra ngoài vì lý do bảo mật).
# /actuator/health dùng cho Docker health check và load balancer.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ==================== SERVER ====================
server.port=8080

# ==================== AI MICROSERVICE ====================
# AI service (FastAPI) nhận dữ liệu giao dịch qua Kafka, API này chỉ để UI đọc kết quả
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}